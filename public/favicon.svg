<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="64" height="64">
  <defs>
    <linearGradient id="G" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#044C38"></stop>
      <stop offset="100%" stop-color="#00A67E"></stop>
    </linearGradient>
    <style>
      .bg { fill: url(#G); }
      .tp { fill: none; stroke: #fff; stroke-width: 8; stroke-linecap: round; }
    </style>
  </defs>
  <circle class="bg" cx="60" cy="60" r="56"></circle>
  <g transform="translate(30,30)">
    <!-- T: strong symmetry -->
